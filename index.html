<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 380px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #2563eb;
      cursor: pointer;
    }

    #msg {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2 id="title">Login</h2>

  <input
    type="text"
    id="username"
    placeholder="Username"
    autocomplete="username"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button onclick="submitForm()" id="btn">
    Login
  </button>

  <div class="switch" onclick="toggleMode()" id="switch">
    Create New Account
  </div>

  <div id="msg"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzK5UTsWo3Tpn37DZrVyxUo4giojqEhhGX0FE0QuuJA2qfaQr7Ey2oCnaiXpF8IWuitUw/exec";

let mode = "login";

function toggleMode() {

  if (mode === "login") {
    mode = "register";

    document.getElementById("title").innerText = "Register";
    document.getElementById("btn").innerText = "Register";
    document.getElementById("switch").innerText =
      "Already have an account? Login";

  } else {
    mode = "login";

    document.getElementById("title").innerText = "Login";
    document.getElementById("btn").innerText = "Login";
    document.getElementById("switch").innerText =
      "Create New Account";
  }

  document.getElementById("msg").innerText = "";
}

async function submitForm() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const msg =
    document.getElementById("msg");

  if (!username || !password) {
    msg.innerText = "Username and password required";
    return;
  }

  msg.innerText = "Please wait...";

  try {

    const response = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: mode,
        username: username,
        password: password
      })
    });

    const result = await response.json();

    msg.innerText = result.message;

    if (result.success) {

      localStorage.setItem(
        "username",
        result.username || username
      );

      localStorage.setItem(
        "wallet",
        result.wallet || 0
      );

      if (mode === "register") {
        alert("Registration successful!");
        toggleMode();
      } else {
        alert("Login successful!");
        // Yahan baad mein tournament home page add kar sakte hain
      }
    }

  } catch (error) {

    msg.innerText =
      "Connection error. Check Web App deployment.";

    console.error(error);
  }
}

</script>

</body>
</html>
